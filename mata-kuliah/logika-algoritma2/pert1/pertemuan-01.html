<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- EDIT: ganti judul tab sesuai pertemuan -->
<title>Pertemuan 01 — Logika dan Algoritma II</title>
<style>
  :root[data-theme="light"]{
    --bg: #F7F6F2;
    --bg-elev: #FFFFFF;
    --ink: #1C2321;
    --ink-soft: #565F5C;
    --line: #DEDCD3;
    --accent: #2F5D50;
    --accent-soft: #E4ECE8;
    --accent-ink: #FFFFFF;
    --code-tone: #8A6D3B;
    --shadow: 0 1px 2px rgba(28,35,33,0.04), 0 8px 24px rgba(28,35,33,0.06);
  }
  :root[data-theme="dark"]{
    --bg: #141816;
    --bg-elev: #1B201D;
    --ink: #EDEFEC;
    --ink-soft: #9AA39E;
    --line: #2B322E;
    --accent: #6FBFA3;
    --accent-soft: #1F2C27;
    --accent-ink: #0E1411;
    --code-tone: #D6B377;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: background .25s ease, color .25s ease;
  }
  h1,h2{
    font-family: "Fraunces", "Iowan Old Style", "Georgia", serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}

  /* ===== Header ===== */
  .site-header{
    border-bottom:1px solid var(--line);
    padding:18px 0;
  }
  .site-header .wrap{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .breadcrumb{
    font-size:13.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .breadcrumb a{color:var(--accent);font-weight:600;}
  .breadcrumb a:hover{text-decoration:underline;}

  .theme-toggle{
    border:1px solid var(--line);
    background:var(--bg-elev);
    color:var(--ink);
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    flex-shrink:0;
  }
  .theme-toggle:hover{border-color:var(--accent);}
  .theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ===== Meeting hero ===== */
  .meeting-hero{padding:56px 0 36px;}
  .meeting-hero .eyebrow{
    color:var(--code-tone);
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    display:block;
    margin-bottom:12px;
  }
  .meeting-hero h1{
    font-size:clamp(26px, 4vw, 34px);
    line-height:1.2;
  }
  .meeting-hero p{
    margin:14px 0 0;
    color:var(--ink-soft);
    font-size:15.5px;
    line-height:1.6;
  }

  /* ===== Action menu ===== */
  .actions{padding:8px 0 80px;}
  .action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }

  .action-card{
    background:var(--bg-elev);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 22px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
    transition: transform .18s ease, border-color .18s ease;
  }
  .action-card:hover{transform:translateY(-3px);border-color:var(--accent);}

  .action-icon{
    width:42px;height:42px;
    border-radius:11px;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .action-icon svg{width:20px;height:20px;}

  .action-card strong{font-size:16px;}
  .action-card span.sub{
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.5;
  }

  @media (max-width:560px){
    .action-grid{grid-template-columns:1fr;}
    .meeting-hero{padding:40px 0 24px;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="breadcrumb">
      <a href="../../index.html">Ruang Kelas Digital</a>
      <span>/</span>
      <!-- EDIT: nama mata kuliah, link ke daftar pertemuan MK ini -->
      <a href="/mata-kuliah/logika-algoritma2/indexalgo2.html">Logika dan Algoritma II</a>
      <span>/</span>
      <span>Pertemuan 01</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema terang/gelap" title="Ganti tema">
      <span id="themeIcon">🌙</span>
    </button>
  </div>
</header>

<section class="meeting-hero">
  <div class="wrap">
    <span class="eyebrow">Pertemuan 01</span>
    <!-- EDIT: judul pertemuan -->
    <h1><!-- Judul Pertemuan --></h1>
    <!-- EDIT: deskripsi singkat materi pertemuan ini -->
    <p><!-- deskripsi singkat materi pertemuan ini --></p>
  </div>
</section>

<section class="actions">
  <div class="wrap">
    <div class="action-grid">

      <!-- ============================================ -->
      <!-- KARTU "LIHAT MATERI"                          -->
      <!-- EDIT href -> file materi (html atau pdf)      -->
      <!-- Bisa dibuka di tab baru (target="_blank")     -->
      <!-- ============================================ -->
      <a class="action-card" href="Logika-dan-Algoritma-2 Pertemuan 1.pptx" target="_blank" rel="noopener">
        <span class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        <strong>Lihat Materi</strong>
        <span class="sub">Buka materi pertemuan ini langsung di browser.</span>
      </a>

      <!-- ============================================ -->
      <!-- KARTU "DOWNLOAD MATERI"                       -->
      <!-- EDIT href -> file materi (pdf/html/dll)       -->
      <!-- atribut "download" akan langsung mengunduh    -->
      <!-- ============================================ -->
      <a class="action-card" href="Logika-dan-Algoritma-2 Pertemuan 1.pptx" download>
        <span class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
        </span>
        <strong>Download Materi</strong>
        <span class="sub">Unduh berkas materi untuk dibaca offline.</span>
      </a>

    </div>
  </div>
</section>

<script>
  const root = document.documentElement;
  const toggleBtn = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');

  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', theme);
  }

  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));

  toggleBtn.addEventListener('click', () => {
    const current = root.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
</script>

</body>
</html>
