<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Pertemuan — Ruang Kelas Digital</title>
<meta name="description" content="Daftar pertemuan mata kuliah — AMIK Mahaputra Riau">
<style>
  :root[data-theme="light"]{
    --bg:#F7F6F2;--bg-elev:#FFFFFF;--ink:#1C2321;--ink-soft:#565F5C;
    --line:#DEDCD3;--accent:#2F5D50;--accent-soft:#E4ECE8;--accent-ink:#FFFFFF;
    --code-tone:#8A6D3B;--shadow:0 1px 2px rgba(28,35,33,0.04),0 8px 24px rgba(28,35,33,0.06);
  }
  :root[data-theme="dark"]{
    --bg:#141816;--bg-elev:#1B201D;--ink:#EDEFEC;--ink-soft:#9AA39E;
    --line:#2B322E;--accent:#6FBFA3;--accent-soft:#1F2C27;--accent-ink:#0E1411;
    --code-tone:#D6B377;--shadow:0 1px 2px rgba(0,0,0,0.3),0 12px 32px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease;}
  h1,h2{font-family:"Fraunces","Iowan Old Style","Georgia",serif;font-weight:600;letter-spacing:-0.01em;margin:0;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:920px;margin:0 auto;padding:0 24px;}

  .site-header{border-bottom:1px solid var(--line);padding:18px 0;}
  .site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .breadcrumb{font-size:13.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .breadcrumb a{color:var(--accent);font-weight:600;}
  .breadcrumb a:hover{text-decoration:underline;}

  .theme-toggle{border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:border-color .2s ease;}
  .theme-toggle:hover{border-color:var(--accent);}
  .theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .course-hero{padding:48px 0 32px;}
  .course-hero .eyebrow{color:var(--code-tone);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:12px;}
  .course-hero h1{font-size:clamp(26px,4vw,36px);line-height:1.2;}
  .course-hero p{margin:14px 0 0;color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:600px;}

  .meetings{padding:8px 0 80px;}
  .meetings h2{font-size:18px;margin-bottom:18px;}
  .meeting-list{display:flex;flex-direction:column;gap:12px;}

  .meeting-row{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:18px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease;}
  .meeting-row:hover{transform:translateX(3px);border-color:var(--accent);}

  .meeting-num{font-family:"Fraunces",serif;font-weight:700;font-size:20px;color:var(--accent);background:var(--accent-soft);width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .meeting-info{flex-grow:1;min-width:0;}
  .meeting-info strong{display:block;font-size:15.5px;}
  .meeting-info span.topic{display:block;color:var(--ink-soft);font-size:13.5px;margin-top:2px;}
  .meeting-arrow{color:var(--ink-soft);flex-shrink:0;}
  .meeting-arrow svg{width:16px;height:16px;transition:transform .15s ease;}
  .meeting-row:hover .meeting-arrow svg{transform:translateX(3px);}
  .meeting-row:hover .meeting-arrow{color:var(--accent);}

  /* Badge status */
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;margin-left:8px;vertical-align:middle;}
  .badge-soon{background:#FEF3C7;color:#92400E;}
  .badge-done{background:var(--accent-soft);color:var(--accent);}

  .not-found{text-align:center;padding:80px 24px;color:var(--ink-soft);}
  .not-found h2{font-size:22px;margin-bottom:12px;}

  @media(max-width:520px){
    .meeting-row{padding:14px 16px;gap:14px;}
    .meeting-num{width:40px;height:40px;font-size:17px;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="breadcrumb">
      <a href="index.html">Ruang Kelas Digital</a>
      <span>/</span>
      <span id="breadcrumbMK">—</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema" title="Ganti tema">
      <span id="themeIcon">🌙</span>
    </button>
  </div>
</header>

<section class="course-hero">
  <div class="wrap">
    <span class="eyebrow" id="heroEyebrow">—</span>
    <h1 id="heroTitle">—</h1>
    <p id="heroDesc">—</p>
  </div>
</section>

<section class="meetings">
  <div class="wrap">
    <h2>Daftar Pertemuan</h2>
    <div class="meeting-list" id="meetingList"></div>
  </div>
</section>

<script>
// ================================================================
// DATA MATA KULIAH
// Untuk menambah MK baru: tambah key baru di objek MK_DATA
// Untuk menambah/edit pertemuan: edit array "pertemuan" pada MK terkait
// ================================================================
const BASE = 'https://fadhlykampus70-ops.github.io/Materi_Perkuliahan';

const MK_DATA = {

  algo2: {
    nama: 'Logika dan Algoritma II',
    kode: 'Algoritma-2 · Semester II · 3 SKS',
    desc: 'Mata kuliah lanjutan yang membahas penerapan konsep algoritma dan pemrograman secara lebih mendalam — struktur kontrol, fungsi, rekursi, array, string, file, sorting, dan searching.',
    folder: 'mata-kuliah/logika-algoritma2',
    pertemuan: [
      { no:'01', judul:'Reset Cara Berpikir Algoritmik',       topik:'Logika untuk membedakan penalaran benar/keliru, algoritma untuk menyelesaikan masalah.',  status:'done' },
      { no:'02', judul:'Pseudocode — Langkah Logis Program',   topik:'Pseudocode = Alat Berpikir. Logika dulu, kode belakangan.',                               status:'done' },
      { no:'03', judul:'Operator Aritmatika, Relasional & Logika', topik:'Menerapkan operator pada percabangan, validasi data, dan pengambilan keputusan.',      status:'done' },
      { no:'04', judul:'Percabangan & Pengambilan Keputusan',  topik:'Keputusan diambil dalam setiap percabangan.',                                              status:'done' },
      { no:'05', judul:'Struktur Perulangan dalam Pemrograman',topik:'Melakukan aksi yang sama berulang kali sampai kondisi tertentu terpenuhi.',                status:'done' },
      { no:'06', judul:'Fungsi & Modular Programming',         topik:'Fungsi = "mesin kecil": beri input, mesin mengolah, keluarkan output.',                    status:'done' },
      { no:'07', judul:'Memahami & Menerapkan Rekursi',        topik:'Fungsi memanggil dirinya sendiri hingga mencapai base case.',                              status:'done' },
      { no:'08', judul:'Recall C++ & Pengenalan Python',       topik:'"Pindah dari C++ ke Python, apakah harus belajar ulang dari nol?"',                       status:'done' },
      { no:'09', judul:'Array dalam Python (List) & Pengolahan Data', topik:'Lemari pakaian untuk data — teratur, gampang cari, hemat tempat.',                 status:'done' },
      { no:'10', judul:'String dalam Python',                  topik:'Kumpulan karakter di antara tanda kutip — seperti array khusus teks.',                     status:'done' },
      { no:'11', judul:'Membaca & Menulis File',               topik:'Simpan data ke harddisk supaya bisa dibaca kembali kapan saja.',                           status:'done' },
      { no:'12', judul:'Bubble Sort & Selection Sort',         topik:'Mengurutkan data secara efisien menggunakan dua algoritma klasik.',                        status:'done' },
      { no:'13', judul:'Pertemuan 13',                         topik:'Segera hadir.',                                                                            status:'soon' },
      { no:'14', judul:'Pertemuan 14',                         topik:'Segera hadir.',                                                                            status:'soon' },
      { no:'15', judul:'Pertemuan 15',                         topik:'Segera hadir.',                                                                            status:'soon' },
      { no:'16', judul:'Pertemuan 16',                         topik:'Segera hadir.',                                                                            status:'soon' },
    ]
  },

  webdesain2: {
    nama: 'Web Desain II',
    kode: 'Web Desain-2 · Semester II · 3 SKS',
    desc: 'Kelanjutan dari Web Design I, berfokus pada pengembangan situs web yang lebih kompleks dan dinamis — mencakup Responsive Web Design, Bootstrap 4, komponen UI, dan praktik desain web interaktif.',
    folder: 'mata-kuliah/web-desain2',
    pertemuan: [
      { no:'01', judul:'Pengantar Web Design II: Evolusi dan Interaktivitas',  topik:'Web Design II berfokus pada situs web yang lebih kompleks, dinamis, dan pengalaman pengguna yang responsif.',           status:'done' },
      { no:'02', judul:'Responsive Web Design',                                topik:'Pendekatan desain web yang membuat halaman beradaptasi otomatis terhadap berbagai ukuran layar dan perangkat.',          status:'done' },
      { no:'03', judul:'Framework Responsive Web Design',                      topik:'Framework adalah kerangka kerja yang menyediakan struktur dasar untuk membangun aplikasi web.',                         status:'done' },
      { no:'04', judul:'Pengenalan Bootstrap 4 untuk Pemula',                  topik:'Kenapa kita butuh framework? Memulai Bootstrap 4 dari nol.',                                                            status:'done' },
      { no:'05', judul:'Grid dan Tipografi Bootstrap 4',                       topik:'Mengatur layout halaman secara efisien dan tampilan teks profesional menggunakan sistem bawaan Bootstrap 4.',           status:'done' },
      { no:'06', judul:'Responsive Grid & Typography Lanjutan',                topik:'Masalah utama: layout tidak responsif — solusinya ada di sini.',                                                        status:'done' },
      { no:'07', judul:'Tabel & Form dengan Bootstrap 4',                      topik:'Membuat tampilan data yang rapi dan formulir profesional menggunakan komponen Bootstrap 4.',                            status:'done' },
      { no:'08', judul:"Let's Use It Bootstrap",                               topik:'Mencobakan Bootstrap langsung ke proyek web nyata.',                                                                    status:'done' },
      { no:'09', judul:'Bootstrap Button & Image',                             topik:'Styling tombol dan gambar yang konsisten, responsif, dan profesional hanya dengan class Bootstrap.',                   status:'done' },
      { no:'10', judul:'Helper Class Bootstrap 4',                             topik:'Contextual Color — kelas Bootstrap untuk mengatur warna teks sesuai konteks semantik.',                                status:'done' },
      { no:'11', judul:"Let's Use It Bootstrap V2",                            topik:'Mencobakan Bootstrap ke web — sesi praktik lanjutan.',                                                                  status:'done' },
      { no:'12', judul:'Membuat Komponen Dasar Bootstrap',                     topik:'Membangun dan mengeksplorasi komponen Bootstrap secara interaktif.',                                                   status:'done' },
      { no:'13', judul:'Pertemuan 13',                                         topik:'Segera hadir.',                                                                                                         status:'soon' },
      { no:'14', judul:'Pertemuan 14',                                         topik:'Segera hadir.',                                                                                                         status:'soon' },
      { no:'15', judul:'Pertemuan 15',                                         topik:'Segera hadir.',                                                                                                         status:'soon' },
    ]
  },

  // ── TEMPLATE MK BARU ─────────────────────────────────────────
  // namaKey: {
  //   nama: 'Nama Lengkap MK',
  //   kode: 'Kode · Semester · SKS',
  //   desc: 'Deskripsi singkat.',
  //   folder: 'mata-kuliah/nama-folder',
  //   pertemuan: [
  //     { no:'01', judul:'Judul', topik:'Topik singkat.', status:'done' },
  //   ]
  // },
};

// ================================================================
// RENDER
// ================================================================
const params  = new URLSearchParams(window.location.search);
const mkKey   = params.get('mk');
const mk      = MK_DATA[mkKey];

if (!mk) {
  document.getElementById('meetingList').innerHTML =
    `<div class="not-found"><h2>Mata kuliah tidak ditemukan</h2><p>Kembali ke <a href="index.html" style="color:var(--accent);font-weight:600">Ruang Kelas Digital</a>.</p></div>`;
} else {
  // Isi breadcrumb & hero
  document.title = mk.nama + ' — Ruang Kelas Digital';
  document.getElementById('breadcrumbMK').textContent = mk.nama;
  document.getElementById('heroEyebrow').textContent  = mk.kode;
  document.getElementById('heroTitle').textContent    = mk.nama;
  document.getElementById('heroDesc').textContent     = mk.desc;

  // Render daftar pertemuan
  const list = document.getElementById('meetingList');
  list.innerHTML = mk.pertemuan.map(p => {
    const isSoon = p.status === 'soon';
    const badge  = isSoon
      ? `<span class="badge badge-soon">Segera</span>`
      : `<span class="badge badge-done">✓</span>`;
    const href   = isSoon
      ? '#'
      : `pertemuan.html?mk=${mkKey}&pert=${p.no}`;
    const style  = isSoon ? 'style="opacity:.55;pointer-events:none;cursor:default;"' : '';

    return `
    <a class="meeting-row" href="${href}" ${style}>
      <span class="meeting-num">${p.no}</span>
      <span class="meeting-info">
        <strong>${p.judul}${badge}</strong>
        <span class="topic">${p.topik}</span>
      </span>
      <span class="meeting-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </span>
    </a>`;
  }).join('');
}

// Tema
const root = document.documentElement;
const toggleBtn = document.getElementById('themeToggle');
const icon = document.getElementById('themeIcon');
function applyTheme(t){ root.setAttribute('data-theme',t); icon.textContent=t==='dark'?'☀️':'🌙'; localStorage.setItem('theme',t); }
const saved = localStorage.getItem('theme');
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(saved||(prefersDark?'dark':'light'));
toggleBtn.addEventListener('click',()=>{ applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });
</script>

</body>
</html>
